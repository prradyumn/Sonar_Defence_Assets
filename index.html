<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sonar Defence</title>
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/cockpit.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body class="cockpit">
<div id="stage">
  <!-- WORLD: back → front -->
  <div id="water">
    <div class="grad"></div>
    <div id="manta"></div>
    <div class="track" id="far"></div>
    <div id="fishL"></div>
    <div id="rays"></div>
    <div class="track" id="seabed"></div>
    <div id="caustics"></div>
    <canvas id="snow" width="1920" height="1080"></canvas>
    <div class="deep"></div>
    <div id="depthTint"></div><canvas id="plankton" width="1920" height="1080"></canvas>   <!-- deeper each level -->
  </div>
  <div id="bubbles"></div>
  <div id="sunk"></div>
  <!-- the bow cannon, outside the glass (behind the scale on the glass): it rides the console rail, js/cockpit.js -->
  <div id="cannon"><img src="assets/img/cannon.webp" alt=""><i class="ring"></i><i class="flash"></i></div>

  <div id="scale"></div>
  <div id="play" class="abs" style="width:1920px;height:1080px"></div>
  <div id="fx"></div>

  <div id="sigs"></div>
  <div id="visitors"></div>   <!-- escape pods, and sea creatures that come up to the window -->

  <!-- COCKPIT: we are inside the submarine, looking out through the bow window -->
  <div id="vignette"></div>
  <div id="glass"></div>
  <div id="glassFx"></div>   <!-- bubbles stuck on the glass, knock ripples -->
  <img id="cockpit" src="assets/img/cockpit.webp" alt="">
  <div id="lampDim"></div>   <!-- tones the two ceiling lamps down so the eye stays on the scale -->
  <div id="lamps"><div class="edge"></div><i class="l"></i><i class="r"></i></div>
  <div id="screen"></div>
  <div id="scope"></div>
  <div id="crew"></div>

  <div id="flash"></div>

  <!-- HUD -->
  <div id="hud">
    <!-- one HUD bar: hear-again · mission text · progress -->
    <div id="hudbar"><div class="ibtn" id="btnSpeak" title="Hear it again"></div><div id="strip"></div><div id="pips"></div></div>
    <div id="rule"><span class="l"><i>◀</i> Left → Smaller</span><span class="r">Right → Greater <i>▶</i></span></div>
    <div id="comms"><div id="pName">Commander Meera</div><div id="caption"></div></div>
    <div id="hand"></div>
  </div>
  <div id="fxTop"></div>

  <!-- OVERLAYS -->
  <div class="overlay hidden" id="story"><div class="bg" id="storyBg"></div><div id="storyFx"></div><div id="cast"></div><div id="skipStory">Skip story ▸▸</div><div id="tapNext">tap to continue ▸</div></div>
  <div class="overlay hidden" id="banner"><div class="rings"><i></i><i></i><i></i></div><div class="card"><div class="k" id="bk"></div><div class="t" id="bt"></div><div class="s" id="bs"></div></div></div>
  <div class="overlay hidden" id="done"><div class="card"><div class="t" id="dt"></div><div class="s" id="ds"></div><div class="stars" id="dstars"></div><div class="chain" id="dchain"></div><div class="cta" id="dcta">Next mission</div></div></div>
  <div class="overlay" id="title"><div class="art" role="img" aria-label="Sonar Defence"></div><div class="pings"><i></i><i></i><i></i></div><div class="logo">SONAR DEFENCE</div><div class="sub2">Guard the sea route · Integers on the navigation scale</div><div class="bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div id="start" role="button" tabindex="0" aria-label="Start the game" title="Play"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 25.5c0-4.2 4.6-6.8 8.2-4.6l34.6 21.6c3.4 2.1 3.4 7 0 9.1L46.2 73.2C42.6 75.4 38 72.8 38 68.6z"/></svg><i class="shine"></i></div></div>
</div>
<script src="js/gsap.min.js"></script>
<script src="js/script.js"></script>
<script src="js/layout.js"></script>
<script src="assets/vo/vo_manifest.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/cockpit.js"></script>
<script src="js/fx.js"></script>
<script src="js/levels.js"></script>
<script src="js/qa.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
