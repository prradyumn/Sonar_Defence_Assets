<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sonar Defence</title>
  <link rel="icon" type="image/webp" href="assets/img/sub.webp">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/cockpit.css">
<link rel="stylesheet" href="css/cover.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body class="cockpit">
<div id="stage">
  <!-- WORLD: back → front -->
  <div id="water">
    <div class="grad"></div>
    <div class="track" id="far"></div>
    <div id="fishL"></div>
    <div id="rays"></div>
    <div class="track" id="seabed"></div>
    <div id="caustics"></div>
    <div id="current"></div>   <!-- water movement: drifting current streaks, surface shimmer, depth haze (fx.js) -->
    <canvas id="snow" width="960" height="540"></canvas>
    <div class="deep"></div>
    <div id="depthTint"></div><canvas id="plankton" width="960" height="540"></canvas>   <!-- deeper each level -->
  </div>
  <div id="bubbles"></div>
  <div id="sunk"></div>
  <!-- the bow cannon, outside the glass (behind the scale on the glass): it rides the console rail, js/cockpit.js -->
  <div id="cannon"><img src="assets/img/cannon.webp" alt=""><i class="ring"></i><i class="flash"></i></div>

  <div id="scale"></div>
  <div id="play" class="abs" style="width:1920px;height:1080px"></div>
  <div id="fx"></div>

  <div id="sigs"></div>
  <div id="visitors"></div>   <!-- escape pods, and sea creatures that come up to the window -->

  <!-- COCKPIT: we are inside the submarine, looking out through the bow window -->
  <div id="vignette"></div>
  <div id="glass"></div>
  <div id="glassFx"></div>   <!-- bubbles stuck on the glass, knock ripples -->
  <img id="cockpit" src="assets/img/cockpit.webp" alt="">
  <div id="lampDim"></div>   <!-- tones the two ceiling lamps down so the eye stays on the scale -->
  <div id="lamps"><div class="edge"></div><i class="l"></i><i class="r"></i></div>
  <div id="screen"></div>
  <div id="scope"></div>
  <div id="crew"></div>

  <div id="flash"></div>

  <!-- HUD -->
  <div id="hud">
    <!-- one HUD bar: hear-again · mission text · progress -->
    <!-- the mission panel hangs from the ceiling on two struts; it comes down for each mission and goes back up after (cockpit.js) -->
    <div id="hudbar"><i class="strut" style="left:350px"></i><i class="strut" style="left:1050px"></i>
      <div class="ibtn" id="btnSpeak" title="Hear it again"></div><div id="screen2"><div id="strip"></div></div><div id="pips"></div></div>
    <div id="mounts"><i style="left:610px"></i><i style="left:1310px"></i></div>
    <div id="comms"><div id="pName">Commander Meera</div><div id="caption"></div></div>
    <div id="hand"><svg class="ptr" viewBox="0 0 100 130" aria-hidden="true"><path d="M30 60V14a9 9 0 0 1 18 0v38a8.5 8.5 0 0 1 17 2v4a8 8 0 0 1 16 3v4a7.5 7.5 0 0 1 15 4v21c0 20-14 32-34 32h-6c-16 0-26-8-34-22L8 82a8 8 0 0 1 13-9l9 9z" fill="#fff3e4" stroke="#2a1708" stroke-width="5" stroke-linejoin="round"/><path d="M48 52v12M65 58v9M81 65v7" fill="none" stroke="#2a1708" stroke-width="4" stroke-linecap="round"/></svg></div>
  </div>
  <div id="fxTop"></div>

  <!-- OVERLAYS -->
  <div class="overlay hidden" id="story"><div class="bg" id="storyBg"></div><div id="storyFx"></div><div id="cast"></div><div id="skipStory">Skip story ▸▸</div><div id="tapNext">tap to continue ▸</div></div>
  <div class="overlay hidden" id="banner"><div class="rings"><i></i><i></i><i></i></div><div class="card"><div class="k" id="bk"></div><div class="t" id="bt"></div><div class="s" id="bs"></div></div></div>
  <div class="overlay hidden" id="done"><div class="card"><div class="t" id="dt"></div><div class="s" id="ds"></div><div class="stars" id="dstars"></div><div class="chain" id="dchain"></div><div class="cta" id="dcta">Next mission</div></div></div>
  <div class="overlay" id="title"><div class="art" role="img" aria-label="Sonar Defence: the Coast Guard ship sails towards us"><div class="cv-sky"></div><img class="cv-cloud c1" src="assets/img/cover/cloud_1.webp" alt=""><img class="cv-cloud c2" src="assets/img/cover/cloud_2.webp" alt=""><img class="cv-cloud c3" src="assets/img/cover/cloud_3.webp" alt=""><img class="cv-cloud c4" src="assets/img/cover/cloud_4.webp" alt=""><div class="cv-gull g1"><img src="assets/img/cover/gull.webp" alt=""></div><div class="cv-gull g2"><img src="assets/img/cover/gull.webp" alt=""></div><div class="cv-islands"></div><div class="cv-sea"></div><i class="cv-glint" style="left:371px;top:578px;animation-delay:-1.0s"></i><i class="cv-glint" style="left:89px;top:558px;animation-delay:-2.1s"></i><i class="cv-glint" style="left:136px;top:633px;animation-delay:-1.5s"></i><i class="cv-glint" style="left:559px;top:594px;animation-delay:-0.1s"></i><i class="cv-glint" style="left:484px;top:647px;animation-delay:-0.2s"></i><i class="cv-glint" style="left:132px;top:681px;animation-delay:-1.1s"></i><i class="cv-glint" style="left:619px;top:571px;animation-delay:-2.5s"></i><i class="cv-glint" style="left:685px;top:700px;animation-delay:-1.5s"></i><i class="cv-glint" style="left:103px;top:687px;animation-delay:-1.5s"></i><i class="cv-glint" style="left:90px;top:596px;animation-delay:-0.1s"></i><i class="cv-glint" style="left:176px;top:614px;animation-delay:-1.1s"></i><i class="cv-glint" style="left:593px;top:570px;animation-delay:-1.5s"></i><i class="cv-glint" style="left:613px;top:748px;animation-delay:-1.8s"></i><i class="cv-glint" style="left:145px;top:688px;animation-delay:-1.5s"></i><div class="cv-band far"><i></i></div><div class="cv-band mid"><i></i></div><div class="cv-ship"><img src="assets/img/cover/ship_front.webp" alt=""><img class="radar" src="assets/img/cover/radar.webp" alt=""></div><img class="cv-spray" src="assets/img/cover/bow_spray.webp" alt=""><div class="cv-band near"><i></i></div><div class="cv-foam l" style="animation-delay:-0.00s"><img src="assets/img/cover/foam_1.webp" alt=""></div><div class="cv-foam l" style="animation-delay:-0.85s"><img src="assets/img/cover/foam_2.webp" alt=""></div><div class="cv-foam l" style="animation-delay:-1.70s"><img src="assets/img/cover/foam_3.webp" alt=""></div><div class="cv-foam l" style="animation-delay:-2.55s"><img src="assets/img/cover/foam_4.webp" alt=""></div><div class="cv-foam r" style="animation-delay:-0.00s"><img src="assets/img/cover/foam_1.webp" alt=""></div><div class="cv-foam r" style="animation-delay:-0.85s"><img src="assets/img/cover/foam_2.webp" alt=""></div><div class="cv-foam r" style="animation-delay:-1.70s"><img src="assets/img/cover/foam_3.webp" alt=""></div><div class="cv-foam r" style="animation-delay:-2.55s"><img src="assets/img/cover/foam_4.webp" alt=""></div><div class="cv-logo"><img src="assets/img/cover/logo.webp" alt=""></div></div><div class="pings"><i></i><i></i><i></i></div><div class="logo">SONAR DEFENCE</div><div class="sub2">Guard the sea route · Integers on the navigation scale</div><div id="start" role="button" tabindex="0" aria-label="Start the game" title="Play"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 25.5c0-4.2 4.6-6.8 8.2-4.6l34.6 21.6c3.4 2.1 3.4 7 0 9.1L46.2 73.2C42.6 75.4 38 72.8 38 68.6z"/></svg><i class="shine"></i></div></div>
</div>
<script src="js/gsap.min.js"></script>
<script src="js/lang_hi.js"></script>
<script src="js/script.js"></script>
<script src="js/layout.js"></script>
<script src="assets/vo/vo_manifest.js"></script>
<script src="assets/vo/hi/vo_manifest.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/cockpit.js"></script>
<script src="js/water.js"></script>
<script src="js/fx.js"></script>
<script src="js/levels.js"></script>
<script src="js/qa.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
